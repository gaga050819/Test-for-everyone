services:
  - type: web
    name: secureexam-no-ai
    runtime: node
    plan: free
    branch: github-no-ai
    autoDeployTrigger: commit
    buildCommand: cd server && npm ci
    startCommand: cd server && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ENABLE_LOCAL_HTTPS
        value: "false"
      - key: ADMIN_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
