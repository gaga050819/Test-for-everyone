services:
  - type: web
    name: secureexam-no-ai
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ENABLE_LOCAL_HTTPS
        value: "false"
      - key: ADMIN_PASSWORD
        sync: false
